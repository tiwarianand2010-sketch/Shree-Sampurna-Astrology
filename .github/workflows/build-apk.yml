name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Store main.dart and pubspec.yaml
      run: |
        mkdir -p ../user_code
        cp lib/main.dart ../user_code/main.dart
        cp pubspec.yaml ../user_code/pubspec.yaml

    - name: Generate Full Android Project Automatically
      run: |
        flutter create --org com.example shree_sampurna_astrology --template=app .
        cp ../user_code/main.dart lib/main.dart
        cp ../user_code/pubspec.yaml pubspec.yaml

    - name: Get Dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: build/app/outputs/flutter-apk/app-debug.apk
